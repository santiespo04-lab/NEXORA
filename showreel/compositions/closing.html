  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var FPS = 30;
      var letters = document.querySelectorAll("#x-logo .x-l");

      // the line draws from the centre, the mark rises out of it
      tl.fromTo("#x-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.0);
      tl.fromTo(letters, { yPercent: 105 }, { yPercent: 0, duration: 0.62, ease: "expo.out", stagger: { each: 0.05, from: "center" } }, 0.2);
      tl.set("#x-dot", { scale: 0, opacity: 0 }, 0);

      // 1.0: the music cuts to its tail — final impact
      tl.set("#x-logo", { filter: "drop-shadow(0 0 80px rgba(255,43,43,1))" }, 1.0);
      tl.to("#x-logo", { filter: "drop-shadow(0 0 30px rgba(255,43,43,0.55))", duration: 1.1, ease: "expo.out" }, 1.0);
      tl.fromTo(letters, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.6, ease: "power2.inOut", stagger: 0.045 }, 1.02);
      tl.fromTo("#x-c-tl", { x: -40, y: -30, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.0);
      tl.fromTo("#x-c-tr", { x: 40, y: -30, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.0);
      tl.fromTo("#x-c-bl", { x: -40, y: 30, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.0);
      tl.fromTo("#x-c-br", { x: 40, y: 30, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 1.0);

      // tagline decodes
      var seed = 0x7a61;
      function r() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      var tag = "IDEAS INTO VISUAL EXPERIENCES.";
      var pool = "ABCDEFGHIKLMNOPRSTVXYZ0123456789#/<>_";
      var tagEl = document.getElementById("x-tag");
      var T0 = 1.15, N = 24;
      for (var fr = 0; fr <= N; fr++) {
        var lock = Math.floor((fr / N) * tag.length), s = "";
        for (var j = 0; j < tag.length; j++) {
          if (tag[j] === " ") s += " ";
          else if (j < lock) s += tag[j];
          else if (j < lock + 6) s += pool[Math.floor(r() * pool.length)];
          else s += " ";
        }
        tl.set(tagEl, { textContent: s }, T0 + fr / FPS);
      }
      tl.set(tagEl, { textContent: tag }, T0 + (N + 1) / FPS);
      tl.fromTo("#x-credit", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.7);

      // 3.0: exit — the words leave, the mark folds into the line, the line becomes the red dot
      tl.to(["#x-tag", "#x-credit"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 3.0);
      tl.to(["#x-c-tl", "#x-c-tr", "#x-c-bl", "#x-c-br"], { opacity: 0, scale: 0.8, duration: 0.3, ease: "power3.in" }, 3.04);
      tl.to(letters, { scaleY: 0, duration: 0.32, ease: "power3.in", stagger: { each: 0.02, from: "edges" } }, 3.1);
      tl.to("#x-line", { scaleX: 0.03, duration: 0.38, ease: "power3.inOut" }, 3.36);
      tl.to("#x-dot", { scale: 1, opacity: 1, duration: 0.12, ease: "power2.out" }, 3.66);
      tl.set("#x-line", { opacity: 0 }, 3.74);
      tl.to("#x-dot", { scale: 0.5, opacity: 0, duration: 0.2, ease: "power2.in" }, 3.78);

      window.__timelines["closing"] = tl;
    })();
  </script>
