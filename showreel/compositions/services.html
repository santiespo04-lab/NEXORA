  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var FPS = 30;
      function rng(seed) {
        var s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          var t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function el(tag, attrs, parent) {
        var e = tag.indexOf("svg:") === 0 ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
      }

      // ---------- build the demo artwork (seeded, like the site covers) ----------
      var R = rng(4242);
      var tracks = document.getElementById("s-d1-tracks");
      var blocks = [];
      for (var tr = 0; tr < 4; tr++) {
        var x = R() * 40;
        while (x < 860) {
          var len = 70 + R() * 190;
          var b = el("i", { class: "s-clipblock" + (R() < 0.16 ? " r" : "") }, tracks);
          b.style.left = x + "px";
          b.style.top = tr * 32 + "px";
          b.style.width = Math.min(len, 880 - x) + "px";
          blocks.push(b);
          x += len + 6 + R() * 22;
        }
      }

      var svg2 = document.getElementById("s-d2-svg");
      var arcs = [];
      var cx = 640, cy = 250;
      for (var i = 0; i < 9; i++) {
        var rr = 36 + i * 30;
        var a0 = R() * 6.28, a1 = a0 + 2 + R() * 2.4;
        var d = "M " + (cx + rr * Math.cos(a0)).toFixed(1) + " " + (cy + rr * Math.sin(a0)).toFixed(1) +
          " A " + rr + " " + rr + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " + (cx + rr * Math.cos(a1)).toFixed(1) + " " + (cy + rr * Math.sin(a1)).toFixed(1);
        arcs.push(el("svg:path", { d: d, fill: "none", stroke: i === 4 ? "#ff2b2b" : "rgba(244,243,239," + (0.14 + i * 0.05).toFixed(2) + ")", "stroke-width": i === 4 ? 4 : 1.6, pathLength: 100, "stroke-dasharray": "100 120", "stroke-dashoffset": 110, "stroke-linecap": "round" }, svg2));
      }
      var P0 = [60, 440], P1 = [300, 30], P2 = [430, 500], P3 = [cx, cy];
      var path = el("svg:path", { d: "M 60 440 C 300 30 430 500 " + cx + " " + cy, fill: "none", stroke: "rgba(244,243,239,0.6)", "stroke-width": 2, pathLength: 100, "stroke-dasharray": "100 120", "stroke-dashoffset": 110 }, svg2);
      function bez(t) {
        var u = 1 - t;
        return [
          u * u * u * P0[0] + 3 * u * u * t * P1[0] + 3 * u * t * t * P2[0] + t * t * t * P3[0],
          u * u * u * P0[1] + 3 * u * u * t * P1[1] + 3 * u * t * t * P2[1] + t * t * t * P3[1],
        ];
      }
      var ghosts = [];
      for (var g = 0; g < 5; g++) ghosts.push(el("svg:circle", { r: 9, cx: P0[0], cy: P0[1], fill: "rgba(255,43,43," + (0.12 + g * 0.08).toFixed(2) + ")" }, svg2));
      var dot = el("svg:circle", { r: 12, cx: P0[0], cy: P0[1], fill: "#ff2b2b" }, svg2);

      var d3 = document.getElementById("s-d3");
      var slides = [];
      for (var s = 0; s < 8; s++) {
        var sl = el("div", { class: "s-slide" + (s === 5 ? " hot" : "") }, d3);
        sl.style.left = 108 + (s % 4) * 190 + "px";
        sl.style.top = 140 + Math.floor(s / 4) * 116 + "px";
        var bar = el("i", {}, sl);
        bar.style.width = 30 + R() * 40 + "%";
        el("b", {}, sl);
        slides.push(sl);
      }

      var frames = document.getElementById("s-d5-frames");
      var fr = [];
      for (var f = 6; f >= 0; f--) {
        var fw = 400 - f * 40, fh = fw * 0.5625;
        var fe = el("i", { class: "s-frame" + (f === 0 ? " r" : "") }, frames);
        fe.style.width = fw + "px";
        fe.style.height = fh + "px";
        fe.style.left = 640 - fw / 2 + "px";
        fe.style.top = 250 - fh / 2 + "px";
        fe.style.opacity = (0.95 - f * 0.11).toFixed(2);
        fr.push({ e: fe, f: f });
      }

      // ---------- timeline ----------
      var tl = gsap.timeline({ paused: true });
      // arrival out of the presentation zoom
      tl.fromTo("#s-stage", { scale: 1.07, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo(["#s-label", "#s-sub"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo("#s-panel", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.0);

      var titles = document.querySelectorAll("#s-title-mask .s-title");
      var tags = document.querySelectorAll("#s-tags-box .s-tags");
      var nums = document.querySelectorAll("#s-num-mask .s-num");
      var demos = ["#s-d1", "#s-d2", "#s-d3", "#s-d4", "#s-d5"];
      var segFill = document.querySelectorAll("#s-tl .s-seg-fill");
      var labs = document.querySelectorAll("#s-tl .s-seg-lab");
      var starts = [0, 1, 2, 3, 4];
      starts.forEach(function (T, i) {
        var tin = i === 0 ? 0.02 : T + 0.06;
        tl.fromTo(titles[i], { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, tin);
        tl.fromTo(nums[i], { yPercent: 100 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, tin + 0.04);
        tl.fromTo(tags[i].children, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out", stagger: 0.06 }, tin + 0.1);
        tl.set(demos[i], { opacity: 1 }, T);
        tl.set(labs[i], { color: "#f4f3ef" }, T);
        tl.fromTo(segFill[i], { scaleX: 0 }, { scaleX: 1, duration: i === 4 ? 0.75 : 1, ease: "none" }, T);
        tl.set(segFill[i], { backgroundColor: "#ff2b2b" }, T);
        if (i < 4) {
          var out = T + 1 - 0.06;
          tl.to(titles[i], { yPercent: -105, duration: 0.26, ease: "power3.in" }, out - 0.14);
          tl.to(nums[i], { yPercent: -100, duration: 0.26, ease: "power3.in" }, out - 0.12);
          tl.to(tags[i].children, { opacity: 0, duration: 0.14, ease: "power2.in" }, out - 0.1);
          tl.to(demos[i], { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, out - 0.08);
          tl.set(segFill[i], { backgroundColor: "rgba(244,243,239,0.4)" }, T + 1);
          tl.set(labs[i], { color: "#8b8a86" }, T + 1);
        }
      });
      // the playhead runs the whole scene
      tl.fromTo("#s-head", { x: 0 }, { x: 936 * 0.95, duration: 4.75, ease: "none" }, 0);

      // demo 1 · edit (0–1)
      tl.fromTo(blocks, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out", stagger: 0.012 }, 0.05);
      tl.fromTo("#s-d1-head", { x: 0 }, { x: 860, duration: 0.95, ease: "none" }, 0.05);
      tl.fromTo("#s-d1-viewer", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 0.02);

      // demo 2 · motion (1–2)
      arcs.forEach(function (a, i) {
        tl.fromTo(a, { attr: { "stroke-dashoffset": 110 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "expo.out" }, 1.02 + i * 0.03);
      });
      tl.fromTo(path, { attr: { "stroke-dashoffset": 110 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 1.05);
      var ease = gsap.parseEase("power3.inOut");
      for (var k = 0; k <= 18; k++) {
        var p = ease(k / 18);
        var q = bez(p);
        tl.set(dot, { attr: { cx: q[0], cy: q[1] } }, 1.35 + k / FPS);
        ghosts.forEach(function (gh, gi) {
          var pg = ease(Math.max(0, k - (5 - gi) * 1.6) / 18);
          var qg = bez(pg);
          tl.set(gh, { attr: { cx: qg[0], cy: qg[1] } }, 1.35 + k / FPS);
        });
      }

      // demo 3 · presentations (2–3)
      tl.fromTo(slides, { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out", stagger: 0.035 }, 2.02);
      tl.to(slides.filter(function (x, i) { return i !== 5; }), { opacity: 0.2, duration: 0.3, ease: "power2.inOut" }, 2.5);
      tl.to(slides[5], { x: 480 - (108 + 1 * 190 + 84), y: 250 - (140 + 116 + 47), scale: 2.5, duration: 0.42, ease: "power3.inOut" }, 2.48);

      // demo 4 · web (3–4)
      tl.fromTo("#s-d4-browser", { clipPath: "inset(0% 100% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "expo.out" }, 3.02);
      tl.fromTo("#s-d4-h1", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 3.14);
      tl.fromTo("#s-d4-h2", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 3.2);
